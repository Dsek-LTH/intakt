# Copy this file to config.yaml and edit it for your organisation.
# config.yaml is gitignored.

out_path:
  reports: output/reports    # generated voucher PDFs
  vouchers: output/vouchers  # pending-voucher JSON, consumed by `intakt upload`

# Who signs the vouchers; printed on every PDF.
attestation:
  name: Förnamn Efternamn
  stil_id: fö1234ef-s

# Human-readable names for account numbers, shown on the PDFs.
account_descriptions:
  "3000": Försäljning inom Sverige
  "3010": Livsmedelsförsäljning
  "6540": IT-tjänster

# Maps product-name prefixes to a committee and its booking account.
# A product named "SK - Coffee" routes to the "sk" mapping below.
# Products that match no prefix fall back to the "sk" mapping.
prefix_mappings:
  c:
    name: cafe
    account: 3000
  sk:
    name: skatt
    account: 3000
  z: # Zettle fees routes to this
    name: skatt
    account: 6540

# Per-committee display info. `name` under prefix_mappings must reference a key here.
committees:
  cafe:
    proper_name: Cafémästeriet
    description: Cafémästeriets verksamhet
    default_cost_center: CAFE02
  skatt:
    proper_name: Skattmästeriet
    description: Bank-, Zettle- eller Swish-kostnader / okända utskott
    default_cost_center: SKT02

# Swish payments whose message has no product label are matched by amount (in öre).
# The value is run through the normal prefix pipeline, so "c-Cola" routes to "c".
swish_amount_fallbacks:
  1300: "c-Cola"
  2200: "c-Monster"

fortnox:
  zettle_account: "1919"   # clearing account for Zettle
  swish_account: "1933"    # clearing account for Swish
  voucher_series: IR       # Fortnox voucher series to post into
